# Server Configuration
server.port=9090

# Database Configuration - PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:winestore}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# JWT Configuration
jwt.secret=${JWT_SECRET:QVNFLVNFQ1JFVFNFLUtFWUFTRUNSRVRLRVlBU0VDUkVUS0VZQU1JQ1JFVFNFLUtFWQ==}
jwt.expiration.access-token-ms=${JWT_EXPIRATION_ACCESS_TOKEN_MS:3600000} 
jwt.expiration.refresh-token-ms=${JWT_EXPIRATION_REFRESH_TOKEN_MS:604800000} 