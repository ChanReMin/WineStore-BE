# Server Configuration
server.port=8080
server.servlet.context-path=/
spring.application.name=winestore

# Write Database Configuration (Primary)
spring.datasource.write.url=jdbc:postgresql://${DB_WRITE_HOST}:${DB_WRITE_PORT}/${DB_DATABASE}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD}
spring.datasource.write.driver-class-name=org.postgresql.Driver
spring.datasource.write.hikari.pool-name=WriteDB-Pool
spring.datasource.write.hikari.maximum-pool-size=10
spring.datasource.write.hikari.minimum-idle=5
spring.datasource.write.hikari.connection-timeout=30000
spring.datasource.write.hikari.idle-timeout=600000
spring.datasource.write.hikari.max-lifetime=1800000

# Read Database Configuration (Replica)
spring.datasource.read.url=jdbc:postgresql://${DB_READ_HOST}:${DB_READ_PORT}/${DB_DATABASE}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD}
spring.datasource.read.driver-class-name=org.postgresql.Driver
spring.datasource.read.hikari.pool-name=ReadDB-Pool
spring.datasource.read.hikari.maximum-pool-size=20
spring.datasource.read.hikari.minimum-idle=10
spring.datasource.read.hikari.connection-timeout=30000
spring.datasource.read.hikari.idle-timeout=600000
spring.datasource.read.hikari.max-lifetime=1800000
spring.datasource.read.hikari.read-only=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.hbm2ddl.auto=none
spring.jpa.properties.hibernate.schema_management_enabled=false
spring.jpa.properties.hibernate.auto_index_creation=false
spring.jpa.properties.javax.persistence.schema-generation.database.action=none

hibernate.schema_generation.create-source = none
hibernate.schema_generation.drop-source = none
hibernate.schema_generation.scripts.action = none

# Enable Flyway for db migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Connection Pool Validation
spring.datasource.write.hikari.connection-test-query=SELECT 1
spring.datasource.read.hikari.connection-test-query=SELECT 1

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG

# SpringDoc OpenAPI Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Swagger UI Configuration
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.filter=true

# Show validation errors
springdoc.show-actuator=false
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null

# 1. Set timezone cho Hibernate/JPA
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# 2. Set timezone cho PostgreSQL connection
spring.datasource.write.hikari.connection-init-sql=SET TIME ZONE 'Asia/Ho_Chi_Minh'
spring.datasource.read.hikari.connection-init-sql=SET TIME ZONE 'Asia/Ho_Chi_Minh'

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.access-token-ms=${JWT_EXPIRATION_ACCESS_TOKEN_MS}
jwt.expiration.refresh-token-ms=${JWT_EXPIRATION_REFRESH_TOKEN_MS}

APP_ALLOWED_ORIGINS=${APP_ALLOWED_ORIGINS}

cloudinary.cloud-name = ${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key = ${CLOUDINARY_API_KEY}
cloudinary.api-secret = ${CLOUDINARY_API_SECRET}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# AI Endpoint
app.ai.endpoint=${AI_API_BASE_URL}
app.ai.product-endpoint=/api/embedding

# VNPAY Configuration
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return.url=http://localhost:3000/payment-result
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.version=2.1.0


momo.partnerCode=${MOMO_PARTNER_CODE}
momo.accessKey=${MOMO_ACCESS_KEY}
momo.secretKey=${MOMO_SECRET_KEY}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.returnUrl=https://www.dev.winestore.id.vn/profile/orders
momo.ipnUrl=https://api.dev.winestore.id.vn/api/v1/payment/momo-ipn


spring.cache.type=caffeine
spring.cache.caffeine.spec=expireAfterWrite=5m
spring.cache.cache-names=notifications,unreadCount,allNotifications