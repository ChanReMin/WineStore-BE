# Server Configuration
server.port=8080

# Write Database Configuration (Primary)
spring.datasource.write.url=jdbc:postgresql://${DB_WRITE_HOST:localhost}:${DB_WRITE_PORT:5432}/${DB_DATABASE:winestore}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME:user}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD:password}
spring.datasource.write.driver-class-name=org.postgresql.Driver
spring.datasource.write.hikari.pool-name=WriteDB-Pool
spring.datasource.write.hikari.maximum-pool-size=10
spring.datasource.write.hikari.minimum-idle=5

# Read Database Configuration (Replica)
spring.datasource.read.url=jdbc:postgresql://${DB_READ_HOST:localhost}:${DB_READ_PORT:5433}/${DB_DATABASE:winestore}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME:user}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD:password}
spring.datasource.read.driver-class-name=org.postgresql.Driver
spring.datasource.read.hikari.pool-name=ReadDB-Pool
spring.datasource.read.hikari.maximum-pool-size=20
spring.datasource.read.hikari.minimum-idle=10

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html