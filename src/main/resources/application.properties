# Server Configuration
server.port=8080
server.servlet.context-path=/
spring.application.name=winestore

# Write Database Configuration (Primary)
spring.datasource.write.url=jdbc:postgresql://${DB_WRITE_HOST}:${DB_WRITE_PORT}/${DB_DATABASE}
spring.datasource.write.username=${SPRING_DATASOURCE_WRITE_USERNAME}
spring.datasource.write.password=${SPRING_DATASOURCE_WRITE_PASSWORD}
spring.datasource.write.driver-class-name=org.postgresql.Driver
spring.datasource.write.hikari.pool-name=WriteDB-Pool
spring.datasource.write.hikari.maximum-pool-size=10
spring.datasource.write.hikari.minimum-idle=5
spring.datasource.write.hikari.connection-timeout=30000
spring.datasource.write.hikari.idle-timeout=600000
spring.datasource.write.hikari.max-lifetime=1800000

# Read Database Configuration (Replica)
spring.datasource.read.url=jdbc:postgresql://${DB_READ_HOST}:${DB_READ_PORT}/${DB_DATABASE}
spring.datasource.read.username=${SPRING_DATASOURCE_READ_USERNAME}
spring.datasource.read.password=${SPRING_DATASOURCE_READ_PASSWORD}
spring.datasource.read.driver-class-name=org.postgresql.Driver
spring.datasource.read.hikari.pool-name=ReadDB-Pool
spring.datasource.read.hikari.maximum-pool-size=20
spring.datasource.read.hikari.minimum-idle=10
spring.datasource.read.hikari.connection-timeout=30000
spring.datasource.read.hikari.idle-timeout=600000
spring.datasource.read.hikari.max-lifetime=1800000
spring.datasource.read.hikari.read-only=true

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.generate-ddl=true

#spring.jpa.properties.hibernate.hbm2ddl.auto=update
#spring.jpa.properties.hibernate.schema_management_enabled=false
#spring.jpa.properties.hibernate.auto_index_creation=false
#spring.jpa.properties.javax.persistence.schema-generation.database.action=none

#hibernate.schema_generation.create-source = none
#hibernate.schema_generation.drop-source = none
#hibernate.schema_generation.scripts.action = none

# Enable Flyway for db migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
#spring.flyway.locations=classpath:db/migration

# ===========================================
# RABBITMQ CONFIGURATION (Message Queue)
# ===========================================
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Virtual Host
spring.rabbitmq.virtual-host=/

# Connection Configuration
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.requested-heartbeat=60

# Publisher Confirms (for reliability)
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Template Configuration
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1000
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.template.retry.multiplier=2.0
spring.rabbitmq.template.retry.max-interval=10000

# Listener Configuration
spring.rabbitmq.listener.simple.concurrency=5
spring.rabbitmq.listener.simple.max-concurrency=10
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Retry Configuration for Listener
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2.0
spring.rabbitmq.listener.simple.retry.max-interval=10000

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Connection Pool Validation
spring.datasource.write.hikari.connection-test-query=SELECT 1
spring.datasource.read.hikari.connection-test-query=SELECT 1

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.zaxxer.hikari=DEBUG

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=true
springdoc.packages-to-scan=com.example.demo.controllers
springdoc.paths-to-match=/api/**

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration.access-token-ms=${JWT_EXPIRATION_ACCESS_TOKEN_MS}
jwt.expiration.refresh-token-ms=${JWT_EXPIRATION_REFRESH_TOKEN_MS}

APP_ALLOWED_ORIGINS=${APP_ALLOWED_ORIGINS}